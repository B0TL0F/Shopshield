name: CI

# PRs validate and build. Only main pushes publish images to GHCR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test the ten-service application
        run: python tests/integration.py
      - name: Install manifest tooling
        run: python -m pip install PyYAML==6.0.3
      - name: Check dev manifests and render commit-tagged images
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/shopshield
          REVISION: ${{ github.sha }}
          OUTPUT_PATH: ${{ runner.temp }}/dev-workloads.yaml
        run: python scripts/render-dev.py
      - name: Validate Kubernetes schemas without an AKS connection
        run: |
          docker run --rm -v "$PWD/k8s/dev:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary /manifests
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Validate Terraform without configuring remote state
        run: |
          for directory in bootstrap infra; do
            terraform -chdir="$directory" fmt -check
            terraform -chdir="$directory" init -backend=false -input=false
            terraform -chdir="$directory" validate
          done
      - name: Scan source for secrets and vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Report infrastructure misconfigurations for review
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: k8s/dev
          exit-code: '0'

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, catalog, cart, pricing, inventory, orders, payments, shipping, notifications, recommendations]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set lowercase image name and commit tag
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shopshield-${SERVICE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build this service image
        env:
          SERVICE: ${{ matrix.service }}
        # Refresh the base image so available security updates are included.
        run: docker build --pull --build-arg SERVICE="$SERVICE" -t "$IMAGE" .
      - name: Scan image before publishing
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Log in to GHCR on main pushes only
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned image
        if: github.event_name == 'push'
        run: docker push "$IMAGE"
