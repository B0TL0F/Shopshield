apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec:
  podSelector:
    matchLabels: {project: shopshield}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns}
spec:
  podSelector:
    matchLabels: {project: shopshield}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-monitoring}
spec:
  podSelector:
    matchLabels: {project: shopshield}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app: prometheus}
      ports: [{protocol: TCP, port: 8080}]
{{- range $caller, $config := .Values.services }}
{{- range $callee := $config.calls }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $caller }}-to-{{ $callee }}
spec:
  podSelector:
    matchLabels: {app: {{ $caller }}, project: shopshield}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: {{ $callee }}, project: shopshield}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $callee }}-from-{{ $caller }}
spec:
  podSelector:
    matchLabels: {app: {{ $callee }}, project: shopshield}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: {{ $caller }}, project: shopshield}
      ports: [{protocol: TCP, port: 8080}]
{{- end }}
{{- end }}
