# Exception to default-deny: let application pods resolve names such as catalog.
# namespaceSelector AND podSelector are in ONE peer: both must match.
# UDP handles typical DNS queries; TCP supports larger responses and fallback.
# This does not allow application traffic to arbitrary internet destinations.
apiVersion: networking.k8s.io/v1 # Kubernetes API group/version that defines NetworkPolicy.
kind: NetworkPolicy # This resource controls permitted pod network connections.
metadata: # Identifying information for this policy.
  name: allow-dns # Unique policy name within this namespace.
  namespace: shopshield # Create this policy in the application namespace.
spec: # The traffic selection and permission rules.
  podSelector: # Select pods by label; without a namespaceSelector, peers are in this policy namespace.
    matchLabels: # Every label listed here must match (logical AND).
      project: shopshield # Match Shopshield application pods.
  policyTypes: # Directions controlled for the selected application pods.
  - Egress # Outgoing traffic from selected pods.
  egress: # Allowed outgoing connections from the selected pods.
  - to: # Allowed destinations for outgoing connections.
    - namespaceSelector: # Limit this peer to namespaces matching these labels.
        matchLabels: # Every label listed here must match (logical AND).
          kubernetes.io/metadata.name: kube-system # Built-in namespace label: select kube-system only.
      podSelector: # Select pods by label; without a namespaceSelector, peers are in this policy namespace.
        matchLabels: # Every label listed here must match (logical AND).
          k8s-app: kube-dns # Select the cluster DNS pods (verify this label on your cluster).
    ports: # Restrict the allowed connection to these protocols and destination ports.
    - protocol: UDP # Transport protocol for this permission.
      port: 53 # DNS destination port.
    - protocol: TCP # Transport protocol for this permission.
      port: 53 # DNS destination port.
