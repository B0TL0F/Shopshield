apiVersion: networking.k8s.io/v1 # Kubernetes API group/version that defines NetworkPolicy.
kind: NetworkPolicy # This resource controls permitted pod network connections.
metadata: # Identifying information for this policy.
  name: shipping-from-orders # Unique policy name within this namespace.
  namespace: shopshield # Create this policy in the application namespace.
spec: # The traffic selection and permission rules.
  podSelector: # Select pods by label; without a namespaceSelector, peers are in this policy namespace.
    matchLabels: # Every label listed here must match (logical AND).
      app: shipping # Match this particular microservice.
      project: shopshield # Match Shopshield application pods.
  policyTypes: # Directions controlled for the selected application pods.
  - Ingress # Incoming traffic to selected pods.
  ingress: # Allowed incoming connections to the selected pods.
  - from: # Allowed sources for incoming connections.
    - podSelector: # Select pods by label; without a namespaceSelector, peers are in this policy namespace.
        matchLabels: # Every label listed here must match (logical AND).
          app: orders # Match this particular microservice.
          project: shopshield # Match Shopshield application pods.
    ports: # Restrict the allowed connection to these protocols and destination ports.
    - protocol: TCP # Transport protocol for this permission.
      port: 8080 # Application HTTP destination port.
